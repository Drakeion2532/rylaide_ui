<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A434D"/>
      <stop offset="1" stop-color="#1A222C"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#F57C1F"/>
    </linearGradient>
    <linearGradient id="mix" gradientUnits="userSpaceOnUse" x1="430" y1="360" x2="760" y2="760">
      <stop offset="0" stop-color="#2FC9C3"/>
      <stop offset="0.45" stop-color="#9FBF7A"/>
      <stop offset="1" stop-color="#F98924"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22B8B8"/>
      <stop offset="1" stop-color="#3FD9CF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="topCross">
      <rect x="380" y="330" width="200" height="130"/>
    </clipPath>
  </defs>

  <!-- dark rounded tile -->
  

  <g transform="translate(512 524) scale(0.64) translate(-533 -470)">
  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <!-- right ring (gap at top-right for the signal) -->
    <path d="M 645.9 368.0 A 195 195 0 1 0 792.8 487.0" stroke="url(#mix)" stroke-width="64"/>
    <!-- left ring -->
    <circle cx="342" cy="560" r="195" stroke="url(#orange)" stroke-width="64"/>
    <!-- right ring passes over the left ring at the top crossing -->
    <g clip-path="url(#topCross)">
      <path d="M 645.9 368.0 A 195 195 0 1 0 792.8 487.0" stroke="url(#mix)" stroke-width="64"/>
    </g>

    <!-- signal: dot + three arcs -->
    <circle cx="690" cy="420" r="38" fill="url(#teal)" stroke="none"/>
    <path d="M 673.9 328.4 A 93 93 0 0 1 780.2 397.5" stroke="url(#teal)" stroke-width="44"/>
    <path d="M 660.5 252.6 A 170 170 0 0 1 855.0 378.9" stroke="url(#teal)" stroke-width="44"/>
    <path d="M 647.1 176.8 A 247 247 0 0 1 929.7 360.2" stroke="url(#teal)" stroke-width="44"/>
  </g>
  </g>
</svg>
