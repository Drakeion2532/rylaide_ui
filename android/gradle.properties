org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
kotlin.code.style=official
android.nonTransitiveRClass=true

# Where the app loads Rylaide from.
#  - Live server (default): https://rylaide.onrender.com — works anywhere with mobile data, no cable
#  - Testing your own changes over USB: `adb reverse tcp:3000 tcp:3000` and http://localhost:3000
# You can also change it inside the app: Garage → Settings → App server.
rylaideServerUrl=https://rylaide.onrender.com
